<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descubra seu Signo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-5">
    <div class="card shadow-lg p-4 mx-auto caixa" style="max-width: 520px;">
      <h1 class="text-center mb-4">🔮 Descubra seu Signo</h1>
      <label for="dataNascimento" class="form-label">Data de nascimento</label>
      <input type="date" id="dataNascimento" class="form-control mb-3">
      <button id="btnDescobrir" class="btn btn-primary w-100">Descobrir</button>

      <div id="resultado" class="mt-4 d-none">
        <h2 id="signoNome" class="text-center"></h2>
        <p id="signoTexto" class="text-center mb-0"></p>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
